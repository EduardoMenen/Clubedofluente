# Publica o site no GitHub Pages a cada push na branch principal.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # Permite disparar o deploy manualmente pela aba Actions.
  workflow_dispatch:

# Permissões que a action precisa para publicar.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
